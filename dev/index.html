<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>칭찬 스티커 · 개발</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fffaf5;color:#292524;font:16px system-ui,"Noto Sans KR",sans-serif}
header{text-align:center;padding:26px 12px;background:#ffedd5}h1{margin:0}
main{max-width:850px;margin:auto;padding:16px}section{background:white;border:1px solid #f1e5d8;border-radius:16px;padding:16px;margin:0 0 14px}
.row{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.field{flex:1;min-width:180px}
label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
input,button{font:inherit;border:1px solid #d6d3d1;border-radius:10px;padding:10px}input{width:100%}button{cursor:pointer;font-weight:700}
.primary{background:#ea580c;color:white;border-color:#ea580c}.soft{background:#fff7ed;color:#9a3412}
.muted{color:#78716c;font-size:13px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.person{border:1px solid #fed7aa;border-radius:14px;padding:14px;background:#fffdf9}.person h3{margin:0 0 8px}
.count{font-size:32px;color:#c2410c;font-weight:800;margin:8px 0 14px}.give{width:100%}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:9px 5px;border-bottom:1px solid #eee}
#notice{display:none;padding:10px;background:#fef3c7;border-radius:10px;margin-bottom:12px}#notice.show{display:block}
.empty{padding:15px;text-align:center;color:#78716c}@media(max-width:480px){.row button{width:100%}}
</style>
</head>
<body>
<header><h1>🧪 칭찬 스티커 개발 페이지</h1><p>작은 칭찬을 모아 서로의 성장을 응원해요!</p></header>
<main><div id="notice"></div>
<section><h3>칭찬하는 사람</h3><div class="row"><div class="field"><label for="giver">내 이름</label><input id="giver" maxlength="30" placeholder="예: 홍길동"></div><button id="save" class="soft">이름 저장</button></div><p class="muted">이름은 이 브라우저에 저장됩니다. 다른 기기에서는 다시 입력해 주세요.</p></section>
<section class="row" style="justify-content:space-between"><div><h3>주간 칭찬 현황</h3><span class="muted">월요일~일요일 기준</span></div><div><label for="week">조회할 주</label><input id="week" type="week"></div></section>
<section><h3>칭찬 스티커 주기</h3><div id="people" class="cards"><div class="empty">불러오는 중…</div></div></section>
<section><h3>칭찬받는 사람 추가</h3><form id="add" class="row"><div class="field"><label for="newname">이름</label><input id="newname" maxlength="30" required placeholder="예: 사람4"></div><button class="primary">대상 추가</button></form></section>
<section><h3>이번 주 칭찬 기록</h3><div id="records" class="empty">불러오는 중…</div></section>
<p class="muted" style="text-align:center">기록은 공용 서버에 저장되어 누구나 확인할 수 있습니다.</p>
</main>
<script>
const API_BASE="https://praise-sticker-app-dev.jeeh.workers.dev";
const $=id=>document.getElementById(id);let state=null;
$("giver").value=localStorage.getItem("praiseGiverName")||"";
function currentWeek(){const d=new Date(),day=(d.getDay()+6)%7;d.setDate(d.getDate()-day+3);const f=new Date(d.getFullYear(),0,4);return d.getFullYear()+"-W"+String(1+Math.round(((d-f)/86400000-3+((f.getDay()+6)%7))/7)).padStart(2,"0")}
$("week").value=currentWeek();
function note(message){$("notice").textContent=message;$("notice").className="show";setTimeout(()=>$("notice").className="",4000)}
function esc(value){return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function api(path,options){const response=await fetch(API_BASE+path,options),data=await response.json();if(!response.ok)throw Error(data.error||"요청 실패");return data}
async function load(){try{state=await api("/api/state?week="+encodeURIComponent($("week").value||currentWeek()));render()}catch(error){note("불러오기 실패: "+error.message);$("people").innerHTML='<div class="empty">서버에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.</div>'}}
function render(){if(!state)return;const giver=$("giver").value.trim();
$("people").innerHTML=state.people.map(person=>'<article class="person"><h3>'+esc(person.name)+'</h3><span class="muted">이번 주 받은 칭찬</span><div class="count">'+person.stickers+'개</div><button class="primary give" data-id="'+person.id+'" '+(!giver?"disabled":"")+'>🌟 칭찬 스티커 주기</button></article>').join("")||'<div class="empty">등록된 사람이 없습니다.</div>';
document.querySelectorAll(".give").forEach(button=>button.onclick=async()=>{const name=$("giver").value.trim();if(!name||!localStorage.getItem("praiseGiverName"))return note("이름을 입력하고 먼저 이름 저장을 눌러 주세요.");button.disabled=true;try{await api("/api/stickers",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({recipientId:+button.dataset.id,giverName:name,week:$("week").value||currentWeek()})});note("칭찬 스티커를 전달했습니다!");await load()}catch(error){note(error.message);button.disabled=false}});
$("records").innerHTML=state.recent.length?'<table><thead><tr><th>받은 사람</th><th>준 사람</th><th>시간</th></tr></thead><tbody>'+state.recent.map(record=>'<tr><td>'+esc(record.recipient)+'</td><td>'+esc(record.giver_name)+'</td><td>'+new Date(record.created_at).toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})+'</td></tr>').join("")+'</tbody></table>':'<div class="empty">이 주에는 아직 기록이 없습니다.</div>'}
$("save").onclick=()=>{const name=$("giver").value.trim();if(!name)return note("이름을 입력해 주세요.");localStorage.setItem("praiseGiverName",name);note("이름을 저장했습니다.");render()};
$("giver").oninput=render;$("week").onchange=load;
$("add").onsubmit=async event=>{event.preventDefault();try{await api("/api/people",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:$("newname").value.trim()})});$("newname").value="";note("대상을 추가했습니다.");await load()}catch(error){note(error.message)}};
load();
</script>
</body>
</html>
