<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>칭찬 스티커</title>
<style>
:root{--ink:#29345c;--muted:#78819d;--pink:#ff75a7}
*{box-sizing:border-box}body{margin:0;background:#f5f7ff;color:var(--ink);font:16px system-ui,"Noto Sans KR",sans-serif}
header{position:relative;overflow:hidden;text-align:center;padding:30px 14px 28px;background:linear-gradient(135deg,#a9dcff,#d8c7ff 55%,#ffd3e4)}
header:before,header:after{content:"✦";position:absolute;font-size:44px;color:#fff9;top:15px}header:before{left:8%}header:after{right:8%}
h1{margin:0;font-size:clamp(27px,6vw,38px);font-weight:1000;letter-spacing:-1px}header p{margin:8px 0 0;font-weight:700;color:#46527d}
main{max-width:900px;margin:auto;padding:16px}section{background:#fff;border:2px solid #e8eaff;border-radius:24px;padding:18px;margin:0 0 15px;box-shadow:0 5px 0 #e9eaff}
h3{margin:0 0 13px;font-size:19px;font-weight:900}.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.field{flex:1;min-width:180px}
label{display:block;font-weight:800;font-size:14px;margin-bottom:7px;color:#59658d}
input,button{font:inherit;border:2px solid #dfe4ff;border-radius:14px;padding:12px}input{width:100%;background:#fbfcff;color:var(--ink)}input:focus{outline:3px solid #c7e8ff;border-color:#79c8ff}
button{cursor:pointer;font-weight:900;transition:transform .12s,box-shadow .12s}button:active{transform:translateY(2px);box-shadow:none}
.primary{background:linear-gradient(135deg,#ff83ad,#ff6399);color:white;border-color:#ff75a7;box-shadow:0 4px 0 #df4f83}
.soft{background:#fff3a9;color:#725400;border-color:#ffdc65;box-shadow:0 4px 0 #edc64b}
.muted{color:var(--muted);font-size:13px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}
.person{border:2px solid #e8eaff;border-radius:21px;padding:16px;background:linear-gradient(160deg,#fff,#f8f9ff);text-align:center}
.person:nth-child(4n+1){background:linear-gradient(160deg,#fff7fb,#fff)}.person:nth-child(4n+2){background:linear-gradient(160deg,#f1faff,#fff)}.person:nth-child(4n+3){background:linear-gradient(160deg,#fffbea,#fff)}.person:nth-child(4n){background:linear-gradient(160deg,#f3fff9,#fff)}
.avatar{font-size:38px;line-height:1.2;margin-bottom:7px}.person h3{margin:0 0 5px;font-size:20px}.count{font-size:34px;color:#ff6498;font-weight:1000;margin:7px 0 12px}.give{width:100%;font-size:16px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:10px 6px;border-bottom:1px solid #edf0ff}th{color:#68749a}
#notice{display:none;padding:12px 14px;background:#fff3b5;border:2px solid #ffdc65;border-radius:15px;margin-bottom:12px;font-weight:800}#notice.show{display:block}
.empty{padding:18px;text-align:center;color:var(--muted);font-weight:700}.hero-tip{margin:0 auto 15px;padding:12px 16px;border-radius:18px;background:#fff;border:2px dashed #c7cfff;text-align:center;font-weight:800;color:#5d6793}
@media(max-width:480px){main{padding:12px}.row button{width:100%}section{padding:15px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.person{padding:12px}.person h3{font-size:17px}.count{font-size:28px}.give{font-size:13px;padding:10px 5px}}
</style>
</head>
<body>
<header><h1>🌈 칭찬 스티커 모험!</h1><p>칭찬 한 번에 반짝반짝! 우리 모두 칭찬 탐험대 ✨</p></header>
<main><div class="hero-tip">💖 오늘의 미션: 친구의 멋진 점을 찾아 칭찬 스티커를 선물해요!</div><div id="notice"></div>
<section><h3>🙋 칭찬 탐험대원</h3><div class="row"><div class="field"><label for="giver">내 이름</label><input id="giver" maxlength="30" placeholder="예: 홍길동"></div><button id="save" class="soft">⭐ 내 이름 저장</button></div><p class="muted">이름은 이 브라우저에 저장됩니다. 다른 기기에서는 다시 입력해 주세요.</p></section>
<section class="row" style="justify-content:space-between"><div><h3>🏆 이번 주 칭찬 현황</h3><span class="muted">월요일~일요일 기준</span></div><div><label for="week">조회할 주</label><input id="week" type="week"></div></section>
<section><h3>🎁 친구에게 스티커 선물하기</h3><div id="people" class="cards"><div class="empty">불러오는 중…</div></div></section>
<section><h3>➕ 새로운 친구 등록하기</h3><form id="add" class="row"><div class="field"><label for="newname">이름</label><input id="newname" maxlength="30" required placeholder="예: 사람4"></div><button class="primary">🎈 친구 추가</button></form></section>
<section><h3>📖 칭찬 추억 모아보기</h3><div id="records" class="empty">불러오는 중…</div></section>
<p class="muted" style="text-align:center">기록은 공용 서버에 저장되어 누구나 확인할 수 있습니다.</p>
</main>
<script>
const API_BASE="https://praise-sticker-app.jeeh.workers.dev";
const $=id=>document.getElementById(id);let state=null;
$("giver").value=localStorage.getItem("praiseGiverName")||"";
function currentWeek(){const d=new Date(),day=(d.getDay()+6)%7;d.setDate(d.getDate()-day+3);const f=new Date(d.getFullYear(),0,4);return d.getFullYear()+"-W"+String(1+Math.round(((d-f)/86400000-3+((f.getDay()+6)%7))/7)).padStart(2,"0")}
$("week").value=currentWeek();
function note(message){$("notice").textContent=message;$("notice").className="show";setTimeout(()=>$("notice").className="",4000)}
function esc(value){return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function api(path,options){const response=await fetch(API_BASE+path,options),data=await response.json();if(!response.ok)throw Error(data.error||"요청 실패");return data}
async function load(){try{state=await api("/api/state?week="+encodeURIComponent($("week").value||currentWeek()));render()}catch(error){note("불러오기 실패: "+error.message);$("people").innerHTML='<div class="empty">서버에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.</div>'}}
function render(){if(!state)return;const giver=$("giver").value.trim();
$("people").innerHTML=state.people.map(person=>'<article class="person"><div class="avatar">🌟</div><h3>'+esc(person.name)+'</h3><span class="muted">이번 주 받은 칭찬</span><div class="count">'+person.stickers+'개</div><button class="primary give" data-id="'+person.id+'" '+(!giver?"disabled":"")+'>💝 칭찬 선물하기</button></article>').join("")||'<div class="empty">등록된 사람이 없습니다.</div>';
document.querySelectorAll(".give").forEach(button=>button.onclick=async()=>{const name=$("giver").value.trim();if(!name||!localStorage.getItem("praiseGiverName"))return note("이름을 입력하고 먼저 이름 저장을 눌러 주세요.");button.disabled=true;try{await api("/api/stickers",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({recipientId:+button.dataset.id,giverName:name,week:$("week").value||currentWeek()})});note("🎉 멋져요! 칭찬 스티커를 선물했어요!");await load()}catch(error){note(error.message);button.disabled=false}});
$("records").innerHTML=state.recent.length?'<table><thead><tr><th>받은 사람</th><th>준 사람</th><th>시간</th></tr></thead><tbody>'+state.recent.map(record=>'<tr><td>'+esc(record.recipient)+'</td><td>'+esc(record.giver_name)+'</td><td>'+new Date(record.created_at).toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})+'</td></tr>').join("")+'</tbody></table>':'<div class="empty">이 주에는 아직 기록이 없습니다.</div>'}
$("save").onclick=()=>{const name=$("giver").value.trim();if(!name)return note("이름을 입력해 주세요.");localStorage.setItem("praiseGiverName",name);note("이름을 저장했습니다.");render()};
$("giver").oninput=render;$("week").onchange=load;
$("add").onsubmit=async event=>{event.preventDefault();try{await api("/api/people",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:$("newname").value.trim()})});$("newname").value="";note("대상을 추가했습니다.");await load()}catch(error){note(error.message)}};
load();
</script>
</body>
</html>
